loggers:
  root:
    level: INFO
    handlers:
      - console
      - file
handlers:
  console:
    class: logging.StreamHandler
    formatter: detailed
  file:
    class: logging.handlers.TimedRotatingFileHandler
    filename: /var/log/service/service.log
    when: midnight
    backupCount: 14
    formatter: detailed
formatters:
  detailed:
    format: '%(asctime)s [%(levelname)s] %(name)s - %(message)s'
config: !include ./config.yaml
